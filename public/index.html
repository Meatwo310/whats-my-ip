<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What's My IP?</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: sans-serif;
      }

      button {
        padding: 0.6em 1.4em;
        font-size: 1rem;
        cursor: pointer;
      }

      #result {
        margin-top: 1em;
        font-size: 1.2rem;
      }

      table {
        margin-top: 1em;
        border-collapse: collapse;
      }

      td {
        padding: 0.3em 0.8em;
        font-size: 1.1rem;
      }

      td:first-child {
        font-weight: bold;
        text-align: right;
        color: #555;
      }

      #github-link {
        position: fixed;
        bottom: 1.2em;
        left: 1.2em;
        display: flex;
        align-items: center;
        gap: 0.4em;
        padding: 0.4em 0.75em;
        border-radius: 999px;
        font-size: 0.8rem;
        color: #999;
        text-decoration: none;
        border: 1px solid transparent;
        transition: color 0.2s, border-color 0.2s, background 0.2s;
      }

      #github-link:hover {
        color: #222;
        border-color: #ddd;
        background: #f9f9f9;
      }

      #github-link svg {
        flex-shrink: 0;
        opacity: 0.6;
        transition: opacity 0.2s;
      }

      #github-link:hover svg {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <button id="btn">Show my public IP</button>
    <table id="result" hidden>
      <tr><td>IP:</td><td id="ip"></td></tr>
      <tr id="ipv6-row" hidden><td>Real IPv6:</td><td id="ipv6"></td></tr>
      <tr><td>Country:</td><td id="country"></td></tr>
    </table>
    <p id="error"></p>
    <a id="github-link" href="https://github.com/Meatwo310/whats-my-ip" target="_blank" rel="noopener noreferrer">
      <svg width="16" height="16" viewBox="0 0 98 96" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M48.854 0C21.839 0 0 22 0 49.217c0 21.756 13.993 40.172 33.405 46.69 2.427.49 3.316-1.059 3.316-2.362 0-1.141-.08-5.052-.08-9.127-13.59 2.934-16.42-5.867-16.42-5.867-2.184-5.704-5.42-7.17-5.42-7.17-4.448-3.015.324-3.015.324-3.015 4.934.326 7.523 5.052 7.523 5.052 4.367 7.496 11.404 5.378 14.235 4.074.404-3.178 1.699-5.378 3.074-6.6-10.839-1.141-22.243-5.378-22.243-24.283 0-5.378 1.94-9.778 5.014-13.2-.485-1.222-2.184-6.275.486-13.038 0 0 4.125-1.304 13.426 5.052a46.97 46.97 0 0 1 12.214-1.63c4.125 0 8.33.571 12.213 1.63 9.302-6.356 13.427-5.052 13.427-5.052 2.67 6.763.97 11.816.485 13.038 3.155 3.422 5.015 7.822 5.015 13.2 0 18.905-11.404 23.06-22.324 24.283 1.78 1.548 3.316 4.481 3.316 9.126 0 6.6-.08 11.897-.08 13.526 0 1.304.89 2.853 3.316 2.364 19.412-6.52 33.405-24.935 33.405-46.691C97.707 22 75.788 0 48.854 0z" fill="currentColor"/></svg>
      github.com/Meatwo310/whats-my-ip
    </a>
    <script>
      document.getElementById('btn').addEventListener('click', async () => {
        const table = document.getElementById('result');
        const error = document.getElementById('error');
        try {
          const res = await fetch('/api/ip');
          const data = await res.json();
          document.getElementById('ip').textContent = data.ip;
          const ipv6Row = document.getElementById('ipv6-row');
          if (data.ipv6) {
            document.getElementById('ipv6').textContent = data.ipv6;
            ipv6Row.hidden = false;
          } else {
            ipv6Row.hidden = true;
          }
          document.getElementById('country').textContent = data.country;
          table.hidden = false;
          error.textContent = '';
        } catch {
          table.hidden = true;
          error.textContent = 'failed';
        }
      });
    </script>
  </body>
</html>
